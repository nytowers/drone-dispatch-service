spring:
  application:
    name: drone-dispatch-service
  datasource:
    url: jdbc:h2:mem:dronedb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: true
    open-in-view: false
  sql:
    init:
      mode: always
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080

drone:
  scheduler:
    interval-ms: 10000